    subcategories: [Chatbots, Platforms, Tools]
    aliases: []
  Business:
    color: "#ffb347"
    aliases: []
  Creative:
    color: "#ff79c6"
    aliases: []
  Music:
    color: "#c792ea"
    aliases: []
  Crypto:
    color: "#f5d400"
    aliases: []
  Finance:
    color: "#4fc3d8"
    subcategories: [Crypto, Trading, Stocks, Banking, Prediction Markets]
    aliases: []
  News:
    color: "#ff8a5c"
    subcategories: [Austrian, German, International, Tech]
    aliases: []
  Communication:
    color: "#7aa2f7"
    subcategories: [Email, Chat, Video Calls]
    aliases: [Kommunikation]
  Social Media:
    color: "#5ab0f7"
    subcategories: [Reddit, Instagram, Twitter/X, Facebook, TikTok, LinkedIn]
    aliases: []
  Entertainment:
    color: "#ff5a8a"
    subcategories: [Video, Music, Gaming, Gambling, Reference]
    aliases: [Media/Entertainment]
  Research:
    color: "#9ece6a"
    subcategories: [Search, Wikipedia, Academic, Translation]
    aliases: [Searching]
  Shopping:
    color: "#f7768e"
    aliases: []
  Productivity:
    color: "#73daca"
    subcategories: [Documents, Notes, Project Management, Design, Cloud Storage]
    aliases: []
  Government:
    color: "#a9b1d6"
    aliases: []
  Travel:
    color: "#7dcfff"
    aliases: []
  Other:
    color: "#8a95a3"
    aliases: [Uncategorized]

tool_categories:
  Browser:
    color: "#5ab0f7"
    activity: null          # activity comes from the URL / project category
  IDE:
    color: "#6fe28a"
