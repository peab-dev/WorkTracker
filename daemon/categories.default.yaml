    app_subcategories:
      webstorm: IDE
      xcode: IDE
      "intellij*": IDE
      "visual studio*": IDE
  "AI Assistant":
    color: "#d4f500"
    activity: AI
  Media:
    color: "#ff5a8a"
    activity: Entertainment
    app_subcategories:
      spotify: Music
      musik: Music
      podcasts: Podcasts
      vlc: Video
      iina: Video
      quicktime player: Video
      fotos: Photos
      photos: Photos
      photo booth: Photos
  "Dev Tools":
    color: "#6fe28a"
    activity: Development
    app_subcategories:
      terminal: Terminal
      "iterm*": Terminal
      docker desktop: Dev Tools
      mongodb compass: Dev Tools
      filezilla: Dev Tools
      github desktop: Dev Tools
      bambu studio: Dev Tools
      jetbrains toolbox: Dev Tools
  Communication:
    color: "#7aa2f7"
    activity: Communication
    app_subcategories:
      mail: Mail
      nachrichten: Chat
      whatsapp: Chat
      slack: Chat
      telegram: Chat
  Productivity:
    color: "#73daca"
