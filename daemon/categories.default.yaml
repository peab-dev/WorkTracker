# WorkTracker — Default category pool (committed to git)
#
# Single source of truth for category names, colors, aliases and the
# tool→activity bridge. Apps, web URLs, projects and topics all draw
# from this pool (see daemon/categories.py).
#
# Two axes:
#   activity_categories — WHAT kind of activity (Development, AI, News, …).
#                         This is the shared pool: web URLs (domain_categories),
#                         project `category:` values and derived topic
#                         categories all resolve into this set.
#   tool_categories     — WHAT kind of app (Browser, IDE, Media, …).
#                         Matching patterns (app name → tool category) stay in
#                         `app_categories` in project_patterns.*.yaml; this file
#                         adds colors, the activity bridge and app subcategories.
#
# Merge strategy with the gitignored user file `categories.yaml`:
#   activity_categories / tool_categories — user dict extends/overrides per key
#   domain_categories                     — user dict extends/overrides per domain
#
# Schema:
#   activity_categories:
#     <Name>:
#       color: "#rrggbb"        # badge/dot color in the dashboard
#       aliases: [..]           # legacy names mapped to this canonical name on read
#       subcategories: [..]     # informative; used for dropdowns
#   tool_categories:
#     <Name>:
#       color: "#rrggbb"
#       activity: <ActivityName|null>   # null = derived from URL/project (Browser)
#       app_subcategories:              # app-name fnmatch pattern → subcategory
#         <pattern>: <Subcategory>
#   domain_categories:
#     <domain>: [<ActivityName>, <Subcategory>]   # overrides/extends the built-in
#                                                  # DOMAIN_CATEGORIES seed in
#                                                  # web_categories.py

activity_categories:
  Development:
    color: "#6fe28a"
    subcategories: [Code Hosting, Q&A, Packages, Documentation, DevOps, Playground, Local]
    aliases: []
  AI:
